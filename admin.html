<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel administrativo — Divad Jewelry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    body{background:#f5f2ec;font-family:"DM Sans",sans-serif}
    .admin-wrap{max-width:1200px;margin:0 auto;padding:60px 30px 100px}
    .admin-wrap h1{font-family:"Playfair Display";font-weight:500;font-size:32px;margin:0 0 6px}
    .admin-wrap .sub{color:#777;font-size:13px;margin:0 0 26px}
    .admin-msg{padding:70px 0;text-align:center;color:#777}
    .admin-msg .btn{margin-top:18px}
    .admin-tabs{display:flex;gap:10px;margin-bottom:24px}
    .admin-tab{padding:10px 20px;border:1px solid #d8d1c6;background:#fff;font:inherit;font-size:13px;letter-spacing:.4px;cursor:pointer}
    .admin-tab.active{background:#171717;color:#fff;border-color:#171717}
    .admin-section{display:none}
    .admin-section.active{display:block}
    table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
    th,td{padding:12px 14px;border-bottom:1px solid #e8e3da;text-align:left;white-space:nowrap}
    th{background:#171717;color:#fff;font-weight:500;letter-spacing:.4px;font-size:11px;text-transform:uppercase}
    tbody tr:hover{background:#faf8f4}
    .table-scroll{overflow-x:auto;border:1px solid #e8e3da}
    .count{font-size:12px;color:#777;margin-bottom:14px}
    .status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;letter-spacing:.3px}
    .status-pendente{background:#fbe6c8;color:#8a5a12}
    .status-enviado{background:#d7ecd9;color:#2f6b34}
    .ship-btn{border:1px solid #171717;background:#fff;padding:6px 12px;font-size:11px;cursor:pointer;letter-spacing:.3px}
    .ship-btn:hover{background:#171717;color:#fff}
    .order-items{font-size:12px;color:#555;white-space:normal;max-width:220px}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <h1>Painel administrativo</h1>
    <p class="sub">Visível apenas para contas com acesso de administrador.</p>
    <div id="adminMsg" class="admin-msg">A verificar sessão...</div>

    <div id="adminContent" style="display:none">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="orders">Encomendas</button>
        <button class="admin-tab" data-tab="customers">Clientes</button>
      </div>

      <div class="admin-section active" id="section-orders">
        <p class="count" id="ordersCount"></p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Data</th><th>Encomenda</th><th>Cliente</th><th>Morada</th><th>Telefone</th>
                <th>Itens</th><th>Total</th><th>Pagamento</th><th>Estado</th><th></th>
              </tr>
            </thead>
            <tbody id="ordersTbody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-section" id="section-customers">
        <p class="count" id="adminCount"></p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Email</th><th>Nome</th><th>Telefone</th><th>Morada</th>
                <th>Cód. Postal</th><th>Cidade</th><th>País</th><th>Registado em</th><th>Confirmado</th>
              </tr>
            </thead>
            <tbody id="adminTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser=null;

    function showMsg(html, showLoginBtn){
      const msg=document.querySelector("#adminMsg");
      document.querySelector("#adminContent").style.display="none";
      msg.style.display="block";
      msg.innerHTML = html + (showLoginBtn ? '<br><button class="btn btn-dark" id="adminLoginBtn">Iniciar sessão</button>' : "");
      if(showLoginBtn){
        document.querySelector("#adminLoginBtn").onclick=()=>window.netlifyIdentity.open();
      }
    }

    document.querySelectorAll(".admin-tab").forEach(t=>t.addEventListener("click",()=>{
      document.querySelectorAll(".admin-tab").forEach(x=>x.classList.remove("active"));
      document.querySelectorAll(".admin-section").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      document.querySelector("#section-"+t.dataset.tab).classList.add("active");
    }));

    function euro(n){return new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n)}

    function renderCustomers(users){
      document.querySelector("#adminCount").textContent = users.length + (users.length===1 ? " cliente registado" : " clientes registados");
      document.querySelector("#adminTbody").innerHTML = users.map(u=>`
        <tr>
          <td>${u.email}</td>
          <td>${u.full_name||"—"}</td>
          <td>${u.phone||"—"}</td>
          <td>${u.address||"—"}</td>
          <td>${u.zip||"—"}</td>
          <td>${u.city||"—"}</td>
          <td>${u.country||"—"}</td>
          <td>${u.created_at ? new Date(u.created_at).toLocaleDateString("pt-PT") : "—"}</td>
          <td>${u.confirmed ? "Sim" : "Não"}</td>
        </tr>`).join("") || '<tr><td colspan="9">Ainda não há clientes registados.</td></tr>';
    }

    function renderOrders(orders){
      document.querySelector("#ordersCount").textContent = orders.length + (orders.length===1 ? " encomenda" : " encomendas");
      document.querySelector("#ordersTbody").innerHTML = orders.map(o=>`
        <tr data-order="${o.id}" data-user="${o.userId}">
          <td>${o.date ? new Date(o.date).toLocaleString("pt-PT") : "—"}</td>
          <td>${o.id}</td>
          <td>${o.customerName || o.customerEmail}<br><small style="color:#999">${o.customerEmail}</small></td>
          <td>${o.customerAddress||"—"}${o.customerZip? ", "+o.customerZip:""}${o.customerCity? " "+o.customerCity:""}</td>
          <td>${o.customerPhone||"—"}</td>
          <td class="order-items">${(o.items||[]).map(i=>i.name).join(", ")}</td>
          <td>${euro(o.total||0)}</td>
          <td>${o.method==="paypal"?"PayPal":"MB WAY"}</td>
          <td><span class="status-pill status-${o.status==='enviado'?'enviado':'pendente'}">${o.status==='enviado'?'Enviado':'Pendente'}</span></td>
          <td>${o.status==='enviado' ? "" : '<button class="ship-btn" data-mark="'+o.id+'|'+o.userId+'">Marcar enviado</button>'}</td>
        </tr>`).join("") || '<tr><td colspan="10">Ainda não há encomendas.</td></tr>';

      document.querySelectorAll("[data-mark]").forEach(btn=>btn.addEventListener("click", async ()=>{
        const [orderId,userId]=btn.dataset.mark.split("|");
        btn.disabled=true;btn.textContent="A guardar...";
        try{
          const token=await currentUser.jwt();
          const res=await fetch("/.netlify/functions/update-order-status",{
            method:"POST",
            headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
            body:JSON.stringify({userId,orderId,status:"enviado"})
          });
          const json=await res.json();
          if(!res.ok){alert("Erro: "+(json.error||"não foi possível atualizar."));btn.disabled=false;btn.textContent="Marcar enviado";return}
          loadOrders(currentUser);
        }catch(err){alert("Erro: "+err.message);btn.disabled=false;btn.textContent="Marcar enviado"}
      }));
    }

    async function loadCustomers(user){
      const token = await user.jwt();
      const res = await fetch("/.netlify/functions/list-customers",{headers:{Authorization:"Bearer "+token}});
      const json = await res.json();
      if(!res.ok){showMsg("Acesso negado: "+(json.error||"sem permissão."),false);return}
      renderCustomers(json.users||[]);
    }

    async function loadOrders(user){
      const token = await user.jwt();
      const res = await fetch("/.netlify/functions/list-orders",{headers:{Authorization:"Bearer "+token}});
      const json = await res.json();
      if(!res.ok){showMsg("Acesso negado: "+(json.error||"sem permissão."),false);return}
      renderOrders(json.orders||[]);
    }

    async function loadAll(user){
      try{
        document.querySelector("#adminMsg").style.display="none";
        document.querySelector("#adminContent").style.display="block";
        await Promise.all([loadOrders(user), loadCustomers(user)]);
      }catch(err){
        showMsg("Erro ao carregar dados: "+err.message,false);
      }
    }

    function checkAccess(user){
      currentUser=user;
      if(!user){
        showMsg("Precisas de iniciar sessão com a tua conta de administrador.", true);
        return;
      }
      const roles = (user.app_metadata && user.app_metadata.roles) || [];
      if(!roles.includes("admin")){
        showMsg("Esta conta não tem acesso ao painel administrativo.", false);
        return;
      }
      showMsg("A carregar dados...", false);
      loadAll(user);
    }

    netlifyIdentity.on("init", checkAccess);
    netlifyIdentity.on("login", checkAccess);
    netlifyIdentity.on("logout", ()=>showMsg("Sessão terminada.", true));
    netlifyIdentity.init();
  </script>
</body>
</html>
